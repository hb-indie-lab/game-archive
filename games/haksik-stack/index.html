<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>학식 쌓기 — HB INDIE LAB</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fdf1de;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;pointer-events:none;color:#4a3222}
  #score{font-size:clamp(40px,11vw,64px);font-weight:900;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.12)}
  #hudBest{margin-top:6px;font-size:14px;font-weight:600;opacity:.7}
  #hudExtra{margin-top:4px;font-size:15px;font-weight:800}
  #level{width:150px;margin:10px auto 0;opacity:0;transition:opacity .4s}
  .lv-tube{position:relative;height:18px;border-radius:999px;background:rgba(255,255,255,.8);
    border:2px solid rgba(74,50,34,.3);box-shadow:inset 0 2px 5px rgba(0,0,0,.15);overflow:hidden}
  .lv-lim{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:rgba(230,57,70,.55);border-radius:2px}
  .lv-mid{position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;background:rgba(74,50,34,.25)}
  #lvBubble{position:absolute;top:3px;left:50%;width:26px;height:12px;margin-left:-13px;border-radius:999px;
    background:#7ed957;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.6);will-change:transform}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(40,25,15,.45);padding:20px;box-sizing:border-box}
  .hidden{display:none!important}
  .card{background:#fffaf2;border-radius:22px;padding:28px 26px 24px;width:min(330px,100%);box-sizing:border-box;
    text-align:center;box-shadow:0 12px 40px rgba(60,30,10,.3);border:3px solid #f2d9b8;animation:pop .28s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .title{font-size:30px;font-weight:900;color:#4a3222;margin:0 0 6px;word-break:keep-all}
  .emoji{font-size:44px;line-height:1.1}
  .desc{font-size:15px;color:#7a5a40;line-height:1.55;margin:10px 0 18px;word-break:keep-all}
  .sub{font-size:15px;color:#7a5a40;line-height:1.5;margin:4px 0 12px;font-style:italic;word-break:keep-all}
  .row{display:flex;justify-content:space-between;align-items:center;background:#f8ead6;border-radius:12px;
    padding:12px 16px;margin:8px 0;font-size:16px;color:#6b4a30}
  .row b{font-size:24px;color:#4a3222}
  .newbest{display:inline-block;margin-bottom:6px;padding:4px 12px;border-radius:999px;background:#ff6b4a;color:#fff;
    font-weight:800;font-size:14px;animation:pulse 1s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}
  button{margin-top:16px;width:100%;padding:15px 0;border:0;border-radius:14px;background:#ff8a3d;color:#fff;
    font-size:19px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #d4621a;touch-action:manipulation}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #d4621a}
  .hint{font-size:12px;color:#b0907a;margin-top:12px}
  .overlay{overflow-y:auto;touch-action:pan-y}
  .map{display:flex;align-items:center;gap:12px;text-align:left;background:#f8ead6;color:#4a3222;
    box-shadow:0 4px 0 #e2c9a6;margin-top:10px;padding:12px 14px;font-size:16px}
  .map:active{box-shadow:0 1px 0 #e2c9a6}
  .map .me{font-size:30px;line-height:1}
  .map .mt{font-weight:800;display:flex;align-items:center;gap:6px}
  .map .md{font-size:12px;font-weight:500;color:#8a6a50;margin-top:2px;word-break:keep-all}
  .map .mb{margin-left:auto;text-align:right;font-size:11px;font-weight:600;color:#9a7658;white-space:nowrap}
  .map .mb b{display:block;font-size:20px;color:#4a3222}
  .tag{font-size:10px;font-weight:900;color:#fff;background:#ff6b4a;border-radius:999px;padding:2px 7px}
  .master{margin-top:14px;text-align:left}
  .tl-head{font-size:12px;font-weight:800;color:#9a7658;margin-bottom:4px}
  .tl{font-size:12px;color:#b0907a;padding:5px 10px;border-radius:9px;margin-top:4px;background:#fbf1e3;word-break:keep-all}
  .tl.on{color:#fff;font-weight:800;background:linear-gradient(90deg,#f6b93b,#e58e26)}
  .btn2{background:#f3e3cc;color:#6b4a30;box-shadow:0 5px 0 #dcc3a0;margin-top:10px}
  .btn2:active{box-shadow:0 1px 0 #dcc3a0}
  .title-earn{margin:4px 0 8px;padding:8px;border-radius:12px;background:linear-gradient(90deg,#f6b93b,#e58e26);color:#fff;font-weight:800;font-size:14px}
  .credit{font-size:11px;color:#c4a88f;margin-top:6px;letter-spacing:.05em}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="hudBest">최고 0</div>
  <div id="hudExtra"></div>
  <div id="level"><div class="lv-tube"><i class="lv-lim" style="left:10%"></i><i class="lv-lim" style="left:90%"></i><i class="lv-mid"></i><b id="lvBubble"></b></div></div>
</div>

<div id="startOverlay" class="overlay">
  <div class="card">
    <div class="emoji">🍱</div>
    <h1 class="title">학식 쌓기</h1>
    <div class="credit">HB INDIE LAB</div>
    <p class="desc" style="margin:10px 0 4px">맵을 골라 시작하세요</p>
    <div id="maps"></div>
    <div id="masterBox" class="master"></div>
    <div class="hint">탭 · 클릭 · 스페이스바로 떨어뜨리기</div>
  </div>
</div>

<div id="overOverlay" class="overlay hidden">
  <div class="card">
    <div class="emoji" id="overEmoji"></div>
    <h1 class="title" id="overTitle"></h1>
    <div id="newBest" class="newbest hidden">신기록!</div>
    <p class="sub" id="overSub"></p>
    <div id="titleEarn" class="hidden"></div>
    <div class="row"><span id="overUnit">점수</span><b id="overScore">0</b></div>
    <div class="row"><span>최고 점수</span><b id="overBest">0</b></div>
    <button id="retryBtn">다시 하기</button>
    <button id="menuBtn" class="btn2">맵 선택</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const FONT = 'system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const pick = arr => arr[Math.random() * arr.length | 0];

  // ===== 테마 =====
  const THEMES = [
Object.assign((() => {
  const FOODS = [
    { name: '밥',       emoji: '🍚', color: '#fffaf0', text: '#5a4030' },
    { name: '국',       emoji: '🍲', color: '#f4a259', text: '#4a2a10' },
    { name: '김치',     emoji: '🌶️', color: '#e5383b', text: '#ffffff' },
    { name: '돈가스',   emoji: '🍖', color: '#c8823a', text: '#ffffff' },
    { name: '계란말이', emoji: '🥚', color: '#ffd34e', text: '#5a4010' },
    { name: '떡볶이',   emoji: '🍢', color: '#ff6b4a', text: '#ffffff' },
    { name: '소시지',   emoji: '🌭', color: '#d9603b', text: '#ffffff' },
    { name: '콩나물',   emoji: '🌱', color: '#eef6cf', text: '#4d5a20' },
    { name: '멸치볶음', emoji: '🐟', color: '#b08968', text: '#ffffff' },
    { name: '제육볶음', emoji: '🥩', color: '#b23a28', text: '#ffffff' },
    { name: '샐러드',   emoji: '🥗', color: '#8bc34a', text: '#ffffff' },
    { name: '요구르트', emoji: '🥛', color: '#f3f0ff', text: '#5a4a80' }
  ];
  const WEIRD = [
    { name: '민초 돈가스', emoji: '🍫', color: '#7fd8be', text: '#1f4d40', lines: ['호불호는 너의 문제야'] },
    { name: '어제 국',     emoji: '🧟', color: '#8a9a5b', text: '#ffffff', lines: ['나 다시 돌아왔어', '버려진 줄 알았지?'] },
    { name: '교수님 가발', emoji: '💇', color: '#3b2f2f', text: '#ffffff', lines: ['쉿, 비밀로 해줘'] },
    { name: '출석부',     emoji: '📋', color: '#f5f5f5', text: '#333333', lines: ['너 3번 결석했더라'] },
    { name: '정체불명 젤리', emoji: '🫧', color: '#c3a6ff', text: '#3a2370', lines: ['나도 내가 뭔지 몰라', '흔들흔들'] },
    { name: '길냥이',     emoji: '🐈', color: '#f2c38b', text: '#5a3a10', lines: ['냥 (반찬 아님)', '나 왜 여기 있냥'] },
    { name: '파인애플 김치', emoji: '🍍', color: '#ffe066', text: '#7a4a00', lines: ['혁신이라 불러줘'] },
    { name: 'F 학점',     emoji: '📉', color: '#9e9e9e', text: '#ffffff', lines: ['나도 쌓이는 중이야'] },
    { name: '숟가락',     emoji: '🥄', color: '#cfd8dc', text: '#37474f', lines: ['도구도 반찬이다'] }
  ];
  const FOOD_LINES = {
    '밥': ['또 내가 맨 밑이야?', '쌀은 죄가 없다'],
    '국': ['나 흘러도 몰라', '국물 튐 주의'],
    '김치': ['…', '(무표정)'],
    '돈가스': ['난 메인이라고!', '소스는 따로 줘'],
    '계란말이': ['말린 건 내 의지가 아니야'],
    '떡볶이': ['매운맛 좀 볼래?'],
    '소시지': ['문어 모양으로 잘라줘'],
    '콩나물': ['키는 내가 제일 커'],
    '멸치볶음': ['우리 형제들 어디 갔어'],
    '제육볶음': ['주인공 등장'],
    '샐러드': ['아무도 날 안 먹어'],
    '요구르트': ['나 디저트인데 왜 여기']
  };
  const SPAWN = ['살살 놔줘…', '나 고소공포증 있어', '기사님 여기서 내려주세요', '떨어뜨리면 고소할 거야', '눈 감고 있을게', '오늘 내 기일인가'];
  const LAND = ['윽!', '무거워…', '너 몇 칼로리야', '개인 공간 좀', '허리 나가겠다', '숨 막혀', '누가 나 좀 먹어줘', '이게 학식이야?'];
  const PERFECT = ['찰떡이네', '오 딱 맞아', '우리 운명인가'];
  const TRAY = ['식판 차가워!', '여기가 내 자리군'];
  const BOTTOM = ['나 아직 살아있어요…', '밑에 사람 있어요!!', '구조 요청…'];
  const SCREAM = ['자유다!!', '엄마아아', '학식 탈출!', '잘 있어라 식판아', '으아아아', '나 원래 반찬 아니었어'];
  const OVER = ['"다음엔 좀 살살 다뤄줘" – 김치 일동', '"우리도 감정이 있다고"', '"식판 반납 거부합니다"', '"오늘 학식은 품절입니다"'];

  function lineFor(f) {
    const own = f.lines || FOOD_LINES[f.name];
    return own && Math.random() < 0.55 ? pick(own) : pick(SPAWN);
  }

  return {
    key: 'alive',
    nameX: -4,
    nameMax: 62,
    pick(score) {
      const p = Math.min(0.65, Math.max(0, (score - 6) * 0.06));
      return pick(Math.random() < p ? WEIRD : FOODS);
    },
    onSpawn(cur, A) { if (Math.random() < 0.7) A.say(cur, lineFor(cur.food), 1.6); },
    onLand(b, A, info) {
      if (info.below) A.say(info.below, pick(info.perfect ? PERFECT : LAND), 1.1);
      else A.say(b, pick(TRAY), 1.4);
      if (A.score % 5 === 0 && A.stack.length > 3) A.say(A.stack[0], pick(BOTTOM), 2);
    },
    onCollapse(fallen, A) {
      const sh = fallen.slice().sort(() => Math.random() - 0.5).slice(0, 3);
      sh.forEach(b => A.say(b, pick(SCREAM), 1.7));
    },
    over() { return { emoji: '🏃', title: '반찬들이 탈출했다!', sub: pick(OVER) }; },

    // 반찬 얼굴: 위에 몇 개가 올라타 있는지에 따라 표정이 바뀜
    drawBlockExtra(ctx, b, A) {
      const fx = 42, fy = 0;
      let look = 0;
      if (A.cur && b !== A.cur) {
        const bx = b.kind === 'stack' ? b.x + A.baseX : b.x;
        look = Math.max(-1, Math.min(1, (A.cur.x - bx) / 120));
      }
      let mood;
      if (b.kind === 'fall') mood = 'scream';
      else if (b.kind === 'cur') mood = b.dropping ? 'scream' : 'nervous';
      else if (A.state === 'collapsing') mood = 'nervous';
      else {
        const above = A.stack.length - 1 - A.stack.indexOf(b);
        mood = above >= 3 ? 'strain' : above >= 1 ? 'meh' : 'happy';
      }
      const ink = '#2b1d12';
      ctx.lineWidth = 1.6; ctx.strokeStyle = ink; ctx.lineCap = 'round';
      const ex = [fx - 7, fx + 7], ey = fy - 4;
      if (mood === 'strain') {
        ctx.beginPath();
        ctx.moveTo(ex[0] - 3, ey - 3); ctx.lineTo(ex[0] + 2, ey); ctx.lineTo(ex[0] - 3, ey + 3);
        ctx.moveTo(ex[1] + 3, ey - 3); ctx.lineTo(ex[1] - 2, ey); ctx.lineTo(ex[1] + 3, ey + 3);
        ctx.stroke();
      } else {
        for (const x of ex) {
          ctx.beginPath(); ctx.arc(x, ey, mood === 'scream' ? 4.2 : 3.6, 0, Math.PI * 2);
          ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.arc(x + look * 1.4, ey + (mood === 'nervous' ? 1.4 : 0), mood === 'scream' ? 1.1 : 1.8, 0, Math.PI * 2);
          ctx.fillStyle = ink; ctx.fill();
        }
      }
      ctx.beginPath();
      if (mood === 'happy') { ctx.arc(fx, fy + 4, 4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
      else if (mood === 'meh') { ctx.moveTo(fx - 4, fy + 8); ctx.lineTo(fx + 4, fy + 8); ctx.stroke(); }
      else if (mood === 'nervous') { ctx.ellipse(fx, fy + 8, 2.2, 1.8, 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (mood === 'strain') {
        ctx.moveTo(fx - 6, fy + 8); ctx.lineTo(fx - 3, fy + 6); ctx.lineTo(fx, fy + 8); ctx.lineTo(fx + 3, fy + 6); ctx.lineTo(fx + 6, fy + 8);
        ctx.stroke();
      } else { ctx.ellipse(fx, fy + 8, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fillStyle = ink; ctx.fill(); }
      if (mood === 'strain' || mood === 'nervous') {
        ctx.beginPath();
        ctx.moveTo(fx + 13, fy - 11); ctx.quadraticCurveTo(fx + 16, fy - 6, fx + 13, fy - 5); ctx.quadraticCurveTo(fx + 10, fy - 6, fx + 13, fy - 11);
        ctx.fillStyle = '#6ec6ff'; ctx.fill();
      }
    }
  };
})(), { title: '반찬의 반란', emoji: '🍱', desc: '반찬에게도 감정이 있다. 정중하게 쌓자', unit: '쌓은 반찬' }),
Object.assign((() => {
  const FOODS = [
    { name: '밥',       emoji: '🍚', color: '#fffaf0', text: '#5a4030' },
    { name: '국',       emoji: '🍲', color: '#f4a259', text: '#4a2a10' },
    { name: '김치',     emoji: '🌶️', color: '#e5383b', text: '#ffffff' },
    { name: '돈가스',   emoji: '🍖', color: '#c8823a', text: '#ffffff' },
    { name: '계란말이', emoji: '🥚', color: '#ffd34e', text: '#5a4010' },
    { name: '떡볶이',   emoji: '🍢', color: '#ff6b4a', text: '#ffffff' },
    { name: '소시지',   emoji: '🌭', color: '#d9603b', text: '#ffffff' },
    { name: '콩나물',   emoji: '🌱', color: '#eef6cf', text: '#4d5a20' },
    { name: '멸치볶음', emoji: '🐟', color: '#b08968', text: '#ffffff' },
    { name: '제육볶음', emoji: '🥩', color: '#b23a28', text: '#ffffff' },
    { name: '샐러드',   emoji: '🥗', color: '#8bc34a', text: '#ffffff' },
    { name: '요구르트', emoji: '🥛', color: '#f3f0ff', text: '#5a4a80' }
  ];
  const MUMBLE = ['음냐…', '5분만…', '돈가스…', '출석 불렀어?', '엄마 나 안 자'];
  const WILLS = ['"오늘도 학식은 맛있었다" – 피해자', '"1교시는 원래 자는 시간이야"', '"내 머리가 왜 축축하지"', '"식판은… 반납해 줘…"', '"다음엔 국은 빼 줘"'];
  const STAGE_LABEL = { uneasy: '뒤척뒤척', frown: '찡그림', angry: '빡침', dying: '위독', dead: '사망(?)' };
  let zT = 0, lastStage = 'sleep', pulse = 0, insetA = 0, labelT = 0;

  // 점수 → 표정 단계
  function stage(A) {
    if (A.score >= 70) return 'dead';
    if (A.state === 'collapsing' || A.state === 'over') return 'shock';
    if (A.score >= 50) return 'dying';
    if (A.score >= 30) return 'angry';
    if (A.score >= 20) return 'frown';
    if (A.score >= 10) return 'uneasy';
    return 'sleep';
  }

  // 얼굴 직접 그리기 (반지름 50 기준 좌표)
  function drawFace(ctx, cx, cy, r, st, t) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(r / 50, r / 50);
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd36b'; ctx.fill();

    ctx.save(); ctx.clip();
    if (st === 'angry') {          // 머리 위쪽부터 빨개짐 (살짝 맥박)
      const k = 0.75 + Math.sin(t * 6) * 0.15;
      const g = ctx.createLinearGradient(0, -50, 0, 15);
      g.addColorStop(0, `rgba(225,30,30,${k})`); g.addColorStop(1, 'rgba(225,30,30,0)');
      ctx.fillStyle = g; ctx.fillRect(-50, -50, 100, 65);
    } else if (st === 'dying') {   // 머리가 파래짐
      const g = ctx.createLinearGradient(0, -50, 0, 50);
      g.addColorStop(0, 'rgba(40,80,210,0.92)'); g.addColorStop(1, 'rgba(110,160,235,0.4)');
      ctx.fillStyle = g; ctx.fillRect(-50, -50, 100, 100);
    } else if (st === 'dead') {
      ctx.fillStyle = 'rgba(150,165,190,0.9)'; ctx.fillRect(-50, -50, 100, 100);
    }
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.stroke();

    const ink = '#3b2a1a';
    ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (!worst) { bal.s *= 0.9; bal.r *= 0.9; return; }
    const k = Math.min(1, dt * 8);
    bal.s += ((worst.com - worst.sx) / worst.lim - bal.s) * k;   // -1 ~ 1 이면 안전
    bal.r = Math.abs(bal.s);
    bal.i = worst.i;
  }
  // 위태로운 층 위의 반찬들이 기울어진 쪽으로 살짝 기울고, 위험하면 흔들림
  function tiltOf(idx) {
    if (state !== 'playing' || idx <= bal.i) return 0;
    const wob = bal.r > 0.7 ? Math.sin(t * 16 + idx) * 0.02 * (bal.r - 0.7) / 0.3 : 0;
    return bal.s * 0.045 + wob;
  }
  let lvCache = '';
  function drawLevel() {
    const op = (score >= BALANCE_HIDE ? 0 : bal.a).toFixed(2);
    const pos = Math.max(-1.2, Math.min(1.2, bal.s)) * 40;      // 탱크 폭의 %, ±40% = 한계선
    const col = bal.r < 0.5 ? '#7ed957' : bal.r < 0.8 ? '#ffb020' : '#ff4d5a';
    const key = op + '|' + pos.toFixed(1) + '|' + col;
    if (key === lvCache) return;
    lvCache = key;
    $('level').style.opacity = op;
    $('lvBubble').style.transform = `translateX(${pos * 1.46}px)`;
    $('lvBubble').style.background = col;
  }

  function land() {
    const n = stack.length;
    const sup = supportOf(n - 1);
    const below = stack[n - 1] || null;
    let rx = cur.x - baseX, perfect = false;
    if (n > 0 && Math.abs(rx - sup.x) < 5) { rx = sup.x; perfect = true; }

    const b = cur;
    cur = null;
    Object.assign(b, { kind: 'stack', x: rx, h: n * BH, squash: 0.78, rot: 0 });
    stack.push(b);

    // 각 층 위에 얹힌 전체 무게중심이 허용 범위 밖이면 그 층부터 무너짐 (아래층부터 검사)
    for (const lv of levels()) {
      if (lv.r > 1) { collapse(lv.i + 1, Math.sign(lv.com - lv.sx) || 1); return; }
    }

    score++;
    updateHud();
    burst(b.x + baseX, b.h, b.food.color, perfect ? 16 : 8);
    if (perfect) {
      combo++;
      floater(combo > 1 ? `완벽! x${combo}` : '완벽!', b.x + baseX, b.h + BH + 10);
      if (navigator.vibrate) navigator.vibrate(15);
    } else combo = 0;
    sync();
    if (THEME.onLand) THEME.onLand(b, A, { perfect, below });
    spawn();
  }

  function collapse(level, dir) {
    const fallen = stack.splice(level);
    fallen.forEach((b, k) => {
      b.kind = 'fall'; b.x += baseX;
      b.vx = dir * (90 + Math.random() * 90 + k * 12);
      b.vy = 140 + Math.random() * 120;
      b.av = dir * (2 + Math.random() * 2.5);
      falling.push(b);
    });
    combo = 0; shake = 14; state = 'collapsing'; overT = 1.7;
    if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    sync();
    if (THEME.onCollapse) THEME.onCollapse(fallen, A);
  }

  function gameOver() {
    state = 'over';
    const isNew = score > best;
    const before = earnedIds();
    if (isNew) { best = score; saveBest(); }
    const gained = TITLES.filter(x => x.check() && !before.includes(x.id));
    $('titleEarn').innerHTML = '';
    gained.forEach(x => {
      const d = document.createElement('div');
      d.className = 'title-earn';
      d.textContent = `${x.icon} 칭호 획득: ${x.name}`;
      $('titleEarn').appendChild(d);
    });
    $('titleEarn').classList.toggle('hidden', gained.length === 0);
    $('overUnit').textContent = THEME.unit;
    const o = THEME.over(score, best, isNew);
    $('overEmoji').textContent = o.emoji;
    $('overTitle').textContent = o.title;
    $('overSub').textContent = o.sub || '';
    $('overScore').textContent = score;
    $('overBest').textContent = best;
    $('newBest').classList.toggle('hidden', !(isNew && score > 0));
    $('overOverlay').classList.remove('hidden');
    $('hud').classList.add('hidden');
    overShownAt = performance.now();
  }

  function burst(x, h, color, count) {
    for (let i = 0; i < count; i++) {
      parts.push({ x: x + (Math.random() - 0.5) * BW, h: h + 2,
        vx: (Math.random() - 0.5) * 220, vy: 120 + Math.random() * 220,
        life: 0.6 + Math.random() * 0.3, color, r: 2 + Math.random() * 3 });
    }
  }

  // ===== 업데이트 =====
  function update(dt) {
    t += dt;
    baseX = THEME.sway ? THEME.sway(t, score) : 0;

    if (state === 'playing' || state === 'collapsing') {
      if (cur) {
        if (!cur.dropping) {
          cur.x += cur.dir * speed() * dt;
          const min = BW / 2, max = WW - BW / 2;
          if (cur.x > max) { cur.x = max; cur.dir = -1; }
          if (cur.x < min) { cur.x = min; cur.dir = 1; }
          cur.h += (topH() + HOVER - cur.h) * Math.min(1, dt * 10);
        } else {
          cur.vy += GRAVITY * dt;
          cur.h -= cur.vy * dt;
          if (cur.h <= topH()) { cur.h = topH(); land(); }
        }
      }
      const camT = Math.max(0, topH() - visH() * 0.45);
      cam += (camT - cam) * Math.min(1, dt * 5);
      for (const b of stack) b.squash += (1 - b.squash) * Math.min(1, dt * 14);
      for (const b of falling) {
        b.vy -= GRAVITY * 0.6 * dt;
        b.h += b.vy * dt; b.x += b.vx * dt; b.rot += b.av * dt;
      }
      if (state === 'collapsing') { overT -= dt; if (overT <= 0) gameOver(); }
    }

    for (const p of parts) { p.vy -= GRAVITY * 0.5 * dt; p.x += p.vx * dt; p.h += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floaters) { f.h += f.rise * dt; f.t -= dt * 1.1; }
    floaters = floaters.filter(f => f.t > 0);
    for (const b of bubbles) b.t -= dt;
    bubbles = bubbles.filter(b => b.t > 0);
    shake = Math.max(0, shake - dt * 30);
    updateBalance(dt);

    sync();
    if (THEME.update) THEME.update(dt, A);
  }

  // ===== 그리기 =====
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v * (1 + amt))));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const [c1, c2] = THEME.bg ? THEME.bg(A) : ['#fff6e6', '#fbe3c2'];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const tl = 44 * scale, off = (cam * scale * 0.3) % tl;
    ctx.strokeStyle = typeof THEME.tile === 'function' ? THEME.tile(A) : (THEME.tile || 'rgba(200,160,120,0.18)');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = off - tl; y < H; y += tl) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    for (let x = (W / 2) % tl; x < W; x += tl) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    ctx.stroke();
  }

  function drawTable() {
    const top = sy(TABLE_H);
    if (top > H) return;
    const [c1, c2] = THEME.tableColor || ['#c99a6b', '#b5845a'];
    ctx.fillStyle = c1; ctx.fillRect(-50, top, W + 100, H - top + 80);
    ctx.fillStyle = c2; ctx.fillRect(-50, top, W + 100, 6 * scale);
  }

  function drawTray() {
    const c = THEME.tray || { fill: '#b8c7cf', stroke: '#8fa3ad', inner: '#d3dee3' };
    const cx = sx(WW / 2 + baseX), w = SUP_W * scale, h = SUP_H * scale, y = sy(0);
    if (y > H + 50) return;
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    rr(cx - w / 2 + 4, y + 5, w, h, 8 * scale); ctx.fill();
    ctx.fillStyle = c.fill;
    rr(cx - w / 2, y, w, h, 8 * scale); ctx.fill();
    ctx.strokeStyle = c.stroke; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = c.inner;
    const cw = (w - 24 * scale) / 4;
    for (let i = 0; i < 4; i++) {
      rr(cx - w / 2 + 6 * scale + i * (cw + 4 * scale), y + 4 * scale, cw, Math.max(2, h - 8 * scale), 4 * scale); ctx.fill();
    }
  }

  function drawBlock(b, x, h, rot, squash) {
    const food = b.food;
    ctx.save();
    ctx.translate(sx(x), sy(h));
    ctx.scale(scale, scale);
    ctx.translate(0, -BH / 2);
    ctx.rotate(rot);
    ctx.translate(0, BH / 2);
    ctx.scale(1 + (1 - squash) * 0.6, squash);
    ctx.translate(0, -BH / 2);

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    rr(-BW / 2 + 2, -BH / 2 + 3, BW, BH, 10); ctx.fill();
    ctx.fillStyle = food.color;
    rr(-BW / 2, -BH / 2, BW, BH, 10); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = shade(food.color, -0.25); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    rr(-BW / 2 + 5, -BH / 2 + 4, BW - 10, 7, 4); ctx.fill();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '20px ' + EMOJI_FONT;
    ctx.fillText(food.emoji, -BW / 2 + 22, 2);
    ctx.fillStyle = food.text;
    ctx.font = 'bold 15px ' + FONT;
    const maxW = THEME.nameMax || 88, tw = ctx.measureText(food.name).width;
    if (tw > maxW) ctx.font = `bold ${Math.floor(15 * maxW / tw)}px ${FONT}`;
    ctx.fillText(food.name, THEME.nameX != null ? THEME.nameX : 12, 2);
    if (THEME.drawBlockExtra) THEME.drawBlockExtra(ctx, b, A);
    ctx.restore();
  }

  function drawBubbles() {
    ctx.font = `700 ${Math.round(13 * scale)}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const bb of bubbles) {
      const b = bb.b, x = sx(wx(b)), y = sy(b.h + BH) - 6 * scale;
      if (y < -40 || y > H + 60) continue;
      const w = ctx.measureText(bb.text).width + 18 * scale, h = 24 * scale;
      const bx = Math.max(4, Math.min(W - w - 4, x - w / 2)), by = y - h - 6 * scale;
      const tx = Math.max(bx + 12 * scale, Math.min(bx + w - 12 * scale, x));
      ctx.globalAlpha = Math.min(1, bb.t * 4);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#4a3222'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tx - 6 * scale, by + h - 1); ctx.lineTo(tx, by + h + 7 * scale); ctx.lineTo(tx + 6 * scale, by + h - 1);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      rr(bx, by, w, h, 10 * scale); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx - 5 * scale, by + h - 1); ctx.lineTo(tx + 5 * scale, by + h - 1);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#3a2a1a'; ctx.fillText(bb.text, bx + w / 2, by + h / 2 + 1);
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sync();
    drawBackground();

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    if (THEME.sceneTransform) THEME.sceneTransform(ctx, A);

    if (THEME.drawBack) THEME.drawBack(A);
    drawTable();
    (THEME.drawSupport || drawTray)(A);

    for (const b of stack) {
      const y = sy(b.h);
      if (y < -60 || y > H + 60) continue;
      drawBlock(b, b.x + baseX, b.h, tiltOf(stack.indexOf(b)), b.squash);
    }
    if (cur) {
      if (!cur.dropping) {
        ctx.save();
        ctx.setLineDash([5, 7]);
        ctx.strokeStyle = THEME.guide || 'rgba(120,80,40,0.25)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx(cur.x), sy(cur.h)); ctx.lineTo(sx(cur.x), sy(topH())); ctx.stroke();
        ctx.restore();
      }
      drawBlock(cur, cur.x, cur.h, 0, 1);
    }
    for (const b of falling) drawBlock(b, b.x, b.h, b.rot, 1);

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.h), p.r * scale, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.t));
      ctx.font = `900 ${Math.round(f.size * scale)}px ${FONT}`;
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
      ctx.strokeText(f.text, sx(f.x), sy(f.h));
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, sx(f.x), sy(f.h));
    }
    ctx.globalAlpha = 1;
    drawBubbles();
    ctx.restore();

    if (THEME.drawOverlay) THEME.drawOverlay(A);
    drawLevel();

    const extra = THEME.hud ? THEME.hud(A) : '';
    if (extra !== hudCache) { $('hudExtra').textContent = extra; hudCache = extra; }
    const hc = THEME.hudColor ? THEME.hudColor(A) : '#4a3222';
    if (hc !== hudColorCache) { $('hud').style.color = hc; hudColorCache = hc; }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  // ===== 입력 =====
  cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'playing') drop();
    else if (state === 'ready') startGame();
    else if (state === 'over' && performance.now() - overShownAt > 400) startGame();
  });
  // ===== 맵 선택 메뉴 =====
  function renderMenu() {
    const box = $('maps');
    box.innerHTML = '';
    THEMES.forEach(th => {
      const b = document.createElement('button');
      b.className = 'map';
      const fresh = !loadNum(K(th, 'played'));
      b.innerHTML = `<span class="me"></span><span><span class="mt"><span class="n"></span>${fresh ? '<span class="tag">NEW</span>' : ''}</span>` +
                    `<span class="md"></span></span><span class="mb">최고<b>${loadNum(K(th, 'best'))}</b></span>`;
      b.querySelector('.me').textContent = th.emoji;
      b.querySelector('.n').textContent = th.title;
      b.querySelector('.md').textContent = th.desc;
      b.addEventListener('click', () => { setTheme(th); startGame(); });
      box.appendChild(b);
    });
    const m = $('masterBox');
    m.innerHTML = '';
    const got = TITLES.filter(x => x.check()).length;
    const head = document.createElement('div');
    head.className = 'tl-head'; head.textContent = `칭호 ${got} / ${TITLES.length}`;
    m.appendChild(head);
    TITLES.forEach(x => {
      const on = x.check();
      const row = document.createElement('div');
      row.className = 'tl' + (on ? ' on' : '');
      row.textContent = on ? `${x.icon} ${x.name}` : x.hidden ? '🔒 ???' : `🔒 ${x.name} · ${x.cond}`;
      m.appendChild(row);
    });
  }
  function showMenu() {
    state = 'ready';
    stack = []; falling = []; parts = []; floaters = []; bubbles = []; cur = null; cam = 0; score = 0;
    $('overOverlay').classList.add('hidden');
    $('hud').classList.add('hidden');
    renderMenu();
    $('startOverlay').classList.remove('hidden');
  }

  $('retryBtn').addEventListener('click', () => { if (performance.now() - overShownAt > 400) startGame(); });
  $('menuBtn').addEventListener('click', () => { if (performance.now() - overShownAt > 400) showMenu(); });

  setTheme(THEMES[0]);
  renderMenu();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
